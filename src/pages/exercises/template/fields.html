<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>ExerciseLooper</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header class="heading managing">
    <section class="container">
      <a href="/index.html"><img src="/assets/logo.png" alt="Accueil" /></a>
      <span class="exercise-label">Exercise: <a href="fields.html">[Forms title]</a></span>
    </section>
  </header>

  <main class="container">
    <div class="row">
      <section class="column">
        <h1>Fields</h1>
        <table class="records">
          <thead>
            <tr>
              <th>Label</th>
              <th>Value kind</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <!-- FIELD_ROWS -->
          </tbody>
        </table>

        <form action="<!-- COMPLETE_FORM_ACTION -->" method="post"
              onsubmit="return confirm('Are you sure? You will no longer be able to edit this exercise.');">
          <button class="button" type="submit"><i class="fa fa-comment"></i> Complete and be ready for answers</button>
        </form>
      </section>

      <section class="column">
        <h1>New Field</h1>
        <form action="<!-- FIELD_FORM_ACTION -->" method="post">
          <div class="field">
            <label for="field_label">Label</label>
            <input type="text" name="field[label]" id="field_label" maxlength="50" required />
          </div>

          <div class="field">
            <label for="field_value_kind">Value kind</label>
            <select name="field[value_kind]" id="field_value_kind">
              <option selected="selected" value="single_line">Single line text</option>
              <option value="single_line_list">List of single lines</option>
              <option value="multi_line">Multi-line text</option>
            </select>
          </div>

          <div class="actions">
            <input type="submit" value="Create Field" />
          </div>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
